    <rect x="74" y="40" width="6" height="6" rx="1"/>
    <rect x="64" y="52" width="6" height="6" rx="1"/>
    <rect x="76" y="56" width="6" height="6" rx="1"/>
    <rect x="40" y="76" width="6" height="6" rx="1"/>
    <rect x="52" y="64" width="6" height="6" rx="1"/>
    <rect x="64" y="70" width="6" height="6" rx="1"/>
  </g>
  <!-- central N mark -->
  <rect x="35" y="35" width="26" height="26" rx="5" fill="#e8b339"/>
  <text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#0b0e14" text-anchor="middle">N</text>
