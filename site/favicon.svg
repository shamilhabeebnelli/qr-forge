<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="qg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2138"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#qg-bg)" stroke="#232c42" stroke-width="2"/>
  <!-- QR finder squares -->
  <g>
    <rect x="14" y="14" width="18" height="18" rx="3" fill="#e8b339"/>
    <rect x="18.5" y="18.5" width="9" height="9" rx="1.5" fill="#141927"/>
    <rect x="21.5" y="21.5" width="3" height="3" fill="#e8b339"/>
    <rect x="64" y="14" width="18" height="18" rx="3" fill="#e8b339"/>
    <rect x="68.5" y="18.5" width="9" height="9" rx="1.5" fill="#141927"/>
    <rect x="71.5" y="21.5" width="3" height="3" fill="#e8b339"/>
    <rect x="14" y="64" width="18" height="18" rx="3" fill="#e8b339"/>
    <rect x="18.5" y="68.5" width="9" height="9" rx="1.5" fill="#141927"/>
    <rect x="21.5" y="71.5" width="3" height="3" fill="#e8b339"/>
  </g>
  <!-- scattered data modules -->
